name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m unittest discover -s tests -v -b

  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            dependency: homeassistant==2024.1.0
          - python: "3.14"
            dependency: homeassistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install "${{ matrix.dependency }}"
      - run: python -m tests.ha_smoke
      - run: python -m tests.ha_lifecycle
